      sluzba: "The service type of advertisement expenditures prepaid from the wallet is {sluzba}."
      date: "The date of advertisement expenditures prepaid from the wallet is on {DAYOFWEEK}, {MONTH} {DAY}, {YEAR}."
    ProbehnutoMimoPenezenku:
      date: "The date of advertisement expenditures prepaid but not from the wallet is on {DAYOFWEEK}, {MONTH} {DAY}, {YEAR}."
    __task__:kraj:Client:
