# A dictionary of templates for Griffin feature extraction.
# The keys are the names of the datasets, and the values are dictionaries of templates.
# The templates are dictionaries of strings, and the keys are the names of the features.
# The values are strings that contain the template for the feature.
# The templates are used to extract the features from the data.
Seznam:
  template:
    Client:
      kraj: "Client is located in the {kraj} region."
      obor: "Client is located in the {obor} domain field."
    Dobito:
      sluzba: "The service type of advertisement expenditures charged into the wallet is {sluzba}."
      date: "The date of advertisement expenditures charged into the wallet is on {DAYOFWEEK}, {MONTH} {DAY}, {YEAR}."
    Probehnuto:
      sluzba: "The service type of advertisement expenditures prepaid from the wallet is {sluzba}."
      date: "The date of advertisement expenditures prepaid from the wallet is on {DAYOFWEEK}, {MONTH} {DAY}, {YEAR}."
    ProbehnutoMimoPenezenku:
      date: "The date of advertisement expenditures prepaid but not from the wallet is on {DAYOFWEEK}, {MONTH} {DAY}, {YEAR}."
    __task__:kraj:Client:
      obor: "Predicting the region located in the {obor} domain field."
    __task__:charge:Dobito:
      date: "Predicting the service type with advertisement expenditures charged from the wallet on {DAYOFWEEK}, {MONTH} {DAY}, {YEAR}."
    __task__:prepay:Probehnuto:
      date: "Predicting the service type with advertisement expenditures prepaid into the wallet on {DAYOFWEEK}, {MONTH} {DAY}, {YEAR}."

