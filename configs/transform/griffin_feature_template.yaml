# A dictionary of templates for Griffin feature extraction.
# The keys are the names of the datasets, and the values are dictionaries of templates.
# The templates are dictionaries of strings, and the keys are the names of the features.
# The values are strings that contain the template for the feature.
# The templates are used to extract the features from the data.
Seznam:
  template:
    Client:
      kraj: "Client is located in the {kraj} region."
      obor: "Client is located in the {obor} domain field."
